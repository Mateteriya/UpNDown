<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <script>
    /* До module/SW: www и apex — разные origin, PKCE не переносится. */
    (function () {
      try {
        if (location.hostname.toLowerCase() !== 'www.up2down.ru') return;
        var u = new URL(location.href);
        u.hostname = 'up2down.ru';
        location.replace(u.toString());
      } catch (e) {}
    })();
  </script>
  <script>
    /**
     * OAuth не должен зависеть от PWA-кэша. Если module не вызвал boot за 4с —
     * показываем ошибку (иначе вечно «Завершение входа…» без красного текста).
     */
    (function () {
      var booted = false;
      window.__updownAuthCbBoot = function () {
        booted = true;
      };
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              try {
                r.unregister();
              } catch (e) {}
            });
          });
        }
      } catch (e2) {}
      setTimeout(function () {
        if (booted) return;
        var msg = document.getElementById('msg');
        var err = document.getElementById('err');
        var link = document.getElementById('link');
        if (msg) msg.textContent = '';
        if (err) {
          err.style.display = 'block';
          err.textContent =
            'Ошибка: скрипт входа не запустился (часто кэш PWA). Откройте Incognito или: настройки сайта → удалить данные для up2down.ru. F12→Console/Network: ошибка auth-callback-*.js?';
        }
        if (link) {
          link.textContent = 'Перейти на главную';
          link.style.display = 'inline';
        }
      }, 4000);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Вход…</title>
  <style>
    body{margin:0;background:#0f172a;color:#94a3b8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
    p{margin:0 0 12px;font-size:16px}
    a{color:#22d3ee}
    .err{color:#f87171}
  </style>
</head>
<body>
  <p id="msg">Завершение входа…</p>
  <p id="err" class="err" style="display:none"></p>
  <a id="link" href="/" style="display:none">Перейти на главную</a>
  <script>
    /* До module: сразу понятный статус для VK, не «вечное Завершение…». */
    (function () {
      try {
        if (new URLSearchParams(location.search).get('vk_bridge') === '1') {
          var m = document.getElementById('msg');
          if (m) m.textContent = 'Обмен VK…';
        }
      } catch (e) {}
    })();
  </script>
  <script>
    /**
     * Синхронный мост LAN←прод (до module): Google возвращает code на up2down.online,
     * PKCE verifier — на http://IP:3001. Параметр ud_return = локальный auth-callback.
     */
    (function () {
      var a = document.getElementById('link');
      if (a && location.pathname.indexOf('/play') === 0) a.setAttribute('href', '/play/');

      var PARAM = 'ud_return';
      try {
        var url = new URL(location.href);
        var raw = url.searchParams.get(PARAM);
        if (!raw) return;
        var target = new URL(raw);
        var host = target.hostname.toLowerCase();
        var pathOk = /auth-callback/i.test(target.pathname);
        var privateHost =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          /^192\.168\.\d{1,3}\.\d{1,3}$/.test(host) ||
          /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(host) ||
          /^172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}$/.test(host);
        if (!pathOk || !privateHost) return;
        if (target.protocol !== 'http:' && target.protocol !== 'https:') return;
        if (target.username || target.password) return;
        var same =
          target.origin === url.origin &&
          target.pathname.replace(/\/$/, '') === url.pathname.replace(/\/$/, '');
        if (same) return;
        var hash = url.hash.charAt(0) === '#' ? url.hash.slice(1) : url.hash;
        var hp = new URLSearchParams(hash);
        var hasPayload =
          url.searchParams.get('code') ||
          hp.get('access_token') ||
          url.searchParams.get('error') ||
          url.searchParams.get('error_description');
        if (!hasPayload) return;
        url.searchParams.forEach(function (v, k) {
          if (k === PARAM) return;
          target.searchParams.set(k, v);
        });
        if (url.hash) target.hash = url.hash;
        location.replace(target.toString());
      } catch (e) {
        /* module path will handle */
      }
    })();
  </script>
  <script type="module" src="/src/auth-callback.ts"></script>
</body>
</html>
