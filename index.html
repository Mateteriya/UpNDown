      (function(){var d=document,h=d.documentElement;h.classList.remove('theme-neon');h.classList.add('theme-standard');h.classList.remove('system-dark');h.classList.add('system-light');h.setAttribute('data-theme','standard');try{localStorage.setItem('updown-theme','standard')}catch(e){}var m=d.querySelector('meta[name="color-scheme"]');if(m)m.setAttribute('content','only light');try{var t=localStorage.getItem('updown-card-theme');if(!t&&localStorage.getItem('updown-card-palette-lock')==='1')t='dark';if(t&&t!=='standard')h.classList.add('updown-card-palette-lock');else h.classList.remove('updown-card-palette-lock')}catch(e2){}})();

    <!-- Сброс SW/кэша до загрузки React — если бандл устарел после деплоя -->
    <script>
      (function () {
        var GUARD = 'updown-pwa-recovery-reload';
        var Q = '_updown_recover';
        function go(clearCache) {
          try { sessionStorage.removeItem(GUARD); } catch (e) {}
          var u = new URL(location.href);
          u.searchParams.set(Q, String(Date.now()));
          location.replace(u.toString());
        }
        function clearThenGo() {
          var done = false;
          function finish() { if (!done) { done = true; go(true); } }
          var chain = Promise.resolve();
          if ('serviceWorker' in navigator) {
            chain = chain.then(function () {
              return navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              });
            });
          }
          if ('caches' in window) {
            chain = chain.then(function () {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            });
          }
          Promise.race([chain, new Promise(function (r) { setTimeout(r, 5000); })]).then(finish).catch(finish);
        }
        window.__updownHardReload = function (clearCache) {
          /* Офлайн: сброс кэша уничтожит единственную копию приложения — только мягкий reload */
          if (clearCache && typeof navigator !== 'undefined' && navigator.onLine === false) {
            go(false);
            return;
          }
          if (clearCache) clearThenGo();
          else go(false);
        };
        window.addEventListener('vite:preloadError', function (ev) {
          ev.preventDefault();
          if (sessionStorage.getItem(GUARD)) return;
          try { sessionStorage.setItem(GUARD, '1'); } catch (e) {}
          /* Без сети не unregister SW и не чистим caches — иначе PWA «умирает» в поезде */
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            go(false);
            return;
          }
          clearThenGo();
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var msg = String((ev.reason && ev.reason.message) || ev.reason || '');
          if (!/Failed to fetch dynamically imported module|Loading chunk|Importing a module script failed|error loading dynamically imported module/i.test(msg)) return;
          ev.preventDefault();
          if (sessionStorage.getItem(GUARD)) return;
          try { sessionStorage.setItem(GUARD, '1'); } catch (e) {}
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            go(false);
            return;
          }
          clearThenGo();
        });
        document.addEventListener('DOMContentLoaded', function () {
          var mod = document.querySelector('script[type="module"][src]');
          if (mod) mod.addEventListener('error', function () { window.__updownHardReload(true); }, { once: true });
        });
      })();
    </script>

    <title>Up&Down — Карточная игра на взятки</title>

  <body>
    <div id="root">
      <div id="loading-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#94a3b8;font-size:16px;gap:12px">
        <span>Загрузка…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        setTimeout(function () {
          var lb = document.getElementById('loading-fallback');
          if (!lb || lb.offsetParent === null) return;
          var root = document.getElementById('root');
          if (!root || root.children.length !== 1) return;
          lb.innerHTML =
            '<p style="margin:0 0 8px;color:#e2e8f0;text-align:center;max-width:320px;padding:0 16px">Долго грузится?</p>' +
            '<p style="margin:0 0 12px;font-size:13px;text-align:center;max-width:320px;padding:0 16px;line-height:1.45">На телефоне по Wi‑Fi dev-режим может идти минуту (огромный GameTable.tsx). Либо очистите данные сайта / не открывайте с иконки «на экран».</p>' +
            '<button type="button" onclick="window.__updownHardReload && window.__updownHardReload(false)" style="padding:12px 24px;font-size:16px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#22d3ee;cursor:pointer">Обновить</button>' +
            '<button type="button" onclick="window.__updownHardReload && window.__updownHardReload(true)" style="margin-top:8px;padding:10px 20px;font-size:14px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer">Сбросить кэш</button>';
        }, 20000);
      })();
    </script>
    <!-- Если после возврата с OAuth страница не загрузилась за 8 сек — показать подсказку -->
    <script>
      (function(){
        var h=window.location.hash;
        if(!h||!h.includes('access_token'))return;
        setTimeout(function(){
          var r=document.getElementById('root');
          var lb=document.getElementById('loading-fallback');
          if(r&&r.children.length===1&&lb&&lb.offsetParent!==null){
            lb.innerHTML='<p style="margin:0 0 12px;color:#e2e8f0">Страница не загрузилась</p><p style="margin:0 0 16px;font-size:14px">Нажмите кнопку ниже</p><button type="button" onclick="window.__updownHardReload && window.__updownHardReload(false)" style="padding:12px 24px;font-size:16px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#22d3ee;cursor:pointer">Обновить</button><button type="button" onclick="window.__updownHardReload && window.__updownHardReload(true)" style="display:block;margin:12px auto 0;padding:10px 20px;font-size:14px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer">Сбросить кэш</button>';
          }
        },8000);
      })();
    </script>
